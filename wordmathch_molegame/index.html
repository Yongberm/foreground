<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Word Match - 두더지</title>
    <!-- 그림·CSS 를 바꾸면 버전을 올린다(검수 함정 6). 4차 반영: 20260929 -->
    <!--
      한글 글꼴(나눔스퀘어라운드 ExtraBold)을 CSS 보다 먼저 받기 시작한다. 주소는 styles.css 의 @font-face 와 글자까지
      같아야 한 번만 받는다. 글꼴은 CORS 로 받으므로 crossorigin 이 있어야 미리 받은 것을 그대로 쓴다.
    -->
    <link rel="preload" href="assets/font/NanumFontSetup_OTF_SQUARE_ROUND/NanumSquareRoundOTFEB.otf" as="font" type="font/otf" crossorigin />
    <link rel="stylesheet" href="styles.css?v=2026-10-15e" />
  </head>
  <body>
    <div class="stage-frame">
      <section id="game-stage" class="game-stage" aria-label="담장 위로 올라오는 팻말에서 영어 단어와 뜻을 짝지어 맞추는 게임">

        <!-- 순간 알림. 형제와 같은 자리·같은 역할이다. -->
        <p id="status-toast" class="status-toast" role="status" aria-live="polite"></p>

        <!--
          공용 버튼. 형제 방들과 같은 배치다.
          사운드는 왼쪽 상단, 닫기·뒤로가기는 오른쪽 상단, 도움말은 오른쪽 하단.
        -->
        <div id="stage-tools" class="stage-tools" hidden>
          <button id="sound-button" class="global-control sound-button is-on" type="button" aria-label="소리 끄기" aria-pressed="true"></button>
          <button id="navigation-button" class="global-control navigation-button" type="button" aria-label="게임 닫기"></button>
          <button id="help-button" class="global-control help-button" type="button" aria-label="도움말"></button>
        </div>

        <!-- 시작 화면 -->
        <section id="start-screen" class="screen start-screen" aria-label="시작 화면" hidden>
          <img class="start-background" src="assets/start/start_bg.png" alt="" width="1920" height="1081" draggable="false" />
          <!--
            여우 셋은 로고 뒤에서 고개를 내민다. 그래서 마크업에서 로고보다 먼저
            오고 z-index 도 로고보다 낮다. 좌표는 시안에서 잰 값이며 모두 원본
            크기 그대로 놓는다.
          -->
          <div class="start-hero">
            <div class="start-foxes" aria-hidden="true">
              <img class="start-fox fox-left" src="assets/start/left_top_char.png" alt="" width="307" height="318" draggable="false" />
              <img class="start-fox fox-center" src="assets/start/center_top_char.png" alt="" width="239" height="255" draggable="false" />
              <img class="start-fox fox-right" src="assets/start/rigt_center_char.png" alt="" width="326" height="338" draggable="false" />
            </div>
            <h1 class="start-logo">
              <img src="assets/start/logo.png" alt="Word Match" width="815" height="815" draggable="false" />
            </h1>
          </div>

          <!--
            공통-9: 동화 정보(info 의 title · subtitle). 로고와 Start 사이에 두 줄로 낸다. 값이 없으면 숨기고 배치는 그대로다.
          -->
          <div id="start-story" class="start-story" role="group" aria-label="동화 정보" hidden>
            <p id="start-story-title" class="start-story-title"></p>
            <p id="start-story-subtitle" class="start-story-subtitle"></p>
          </div>

          <nav class="start-menu" aria-label="시작 메뉴">
            <button id="start-button" class="start-menu-button start-menu-button-play" type="button" aria-busy="true" disabled>
              <span>Start</span>
            </button>
            <button id="start-ranking-button" class="start-menu-button start-menu-button-ranking" type="button" disabled>
              <span>Ranking</span>
            </button>
          </nav>
        </section>

        <!-- 게임 화면 -->
        <section id="play-screen" class="screen play-screen" aria-label="두더지 단어 짝맞추기" hidden>
          <img class="play-background" src="assets/game/game_main_bg.png" alt="" width="1920" height="1081" draggable="false" />

          <!-- 여덟 자리. 판은 script.js가 자리마다 하나씩 만들어 넣는다. -->
          <div
            id="board-field"
            class="board-field"
            role="group"
            aria-label="담장 위 팻말. 영어 단어 팻말과 뜻 팻말을 하나씩 눌러 짝을 맞추세요."
          ></div>

          <!-- 하단 바 -->
          <div class="play-hud">
            <img class="hud-background" src="assets/game/ui_bottom_bg.png" alt="" width="1920" height="200" draggable="false" />

            <div class="hud-score">
              <img class="hud-score-box" src="assets/game/box_score.png" alt="" width="336" height="149" draggable="false" />
              <!--
                보너스 순간 Score 상자 둘레에 터지는 금빛 링·반짝임(형제 카드·바다속 방
                #score-burst). 감싼 상자가 하단 바 윗선에서 잘라 팻말 위로 번지지 않는다.
              -->
              <div class="hud-score-fx" aria-hidden="true">
                <span id="score-burst" class="hud-score-burst"></span>
              </div>
              <p id="score-value" class="hud-score-value" aria-live="polite" aria-label="점수 0점">0</p>
              <!--
                점수 증감 표시. 형제 워드매치 방들과 같은 자리·같은 역할이다 —
                Score 상자 위로 +100 / -10 이 떠올랐다 사라진다. 보너스 점수는 2차 수정 10번으로
                여기가 아니라 보너스 여우 위에 뜬다. 읽어 주는 것은 score-value 가 이미 맡고 있어
                여기서는 화면 표시만 한다.
              -->
              <p id="score-delta" class="hud-score-delta" aria-hidden="true"></p>
            </div>

            <!--
              2차 수정 8번: 남은 10초부터 is-urgent, 5초부터 is-critical 이 붙어 숫자 · 스톱워치 · 타임바가
              빨강으로 깜박인다. 타임바 채움은 아래 #timer-fill-red 색 행렬로 빨강 하나로 모은다(바다속 방과 같다).
            -->
            <div id="hud-timer" class="hud-timer">
              <img id="timer-icon" class="hud-timer-icon" src="assets/game/ui_timer1.png" alt="" width="132" height="111" draggable="false" />
              <div class="hud-timer-bar">
                <!-- 막대 그림 둘은 끝 모양을 지키고 가운데만 줄이려고 border-image 로 그린다(styles.css .hud-timer-track · .hud-timer-fill). -->
                <span class="hud-timer-track" aria-hidden="true"></span>
                <div id="timer-fill-clip" class="hud-timer-clip">
                  <span class="hud-timer-fill" aria-hidden="true"></span>
                </div>
              </div>
              <p id="timer-value" class="hud-timer-clock" role="timer" aria-live="off">02:00</p>
              <p id="progress-value" class="visually-hidden" aria-live="polite">0/10</p>
            </div>

            <div id="combo-tray" class="hud-combo" aria-label="연속 정답">
              <img class="combo-fox combo-fox-1" src="assets/game/ui_bonus0.png" alt="" width="119" height="142" draggable="false" />
              <img class="combo-fox combo-fox-2" src="assets/game/ui_bonus1.png" alt="" width="119" height="142" draggable="false" />
              <img class="combo-fox combo-fox-3" src="assets/game/ui_bonus2.png" alt="" width="143" height="177" draggable="false" />
              <!--
                2차 수정 10번: 점수는 Score 위가 아니라 여우 위에 뜬다. 첫째 · 둘째는 정답 점수,
                셋째(보너스)는 BONUS 띠와 보너스 점수. 읽어 주는 것은 score-value 가 맡는다.
              -->
              <span id="combo-gain-1" class="combo-gain combo-gain-1" aria-hidden="true" hidden>+100</span>
              <span id="combo-gain-2" class="combo-gain combo-gain-2" aria-hidden="true" hidden>+100</span>
              <strong id="combo-bonus-gain" class="combo-bonus-gain" aria-hidden="true" hidden>
                <span class="combo-bonus-gain-label">BONUS</span>
                <span id="combo-bonus-gain-value" class="combo-bonus-gain-value">+100</span>
              </strong>
            </div>
            <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
              <filter id="timer-fill-red" color-interpolation-filters="sRGB">
                <feColorMatrix type="matrix" values="0.24 0.48 0.09 0 0.30  0.03 0.06 0.01 0 0.03  0.04 0.08 0.015 0 0.05  0 0 0 1 0" />
              </filter>
            </svg>
          </div>
        </section>

        <!-- 결과 화면. 구조와 좌표는 형제 방들과 같다. -->
        <section id="end-screen" class="screen end-screen" aria-label="게임 결과" hidden>
          <button id="result-replay-button" class="result-replay-button" type="button" aria-label="시작 화면으로">
            <img src="assets/public/btn_close.png" alt="" draggable="false" />
          </button>

          <!--
            결과 화면 배경은 game_main_bg 가 아니라 start_bg 를 쓴다. 두 그림은
            같은 풍경이지만 game_main_bg 는 아래 82px(y 999..1080)이 투명하다 —
            게임 화면에서는 하단 바가 늘 그 자리를 덮으니 비워 둔 것이다. 결과
            화면에는 바가 없어서 그대로 쓰면 무대 바탕색(하늘색)이 띠로 드러난다.
          -->
          <img class="result-background" src="assets/start/start_bg.png" alt="" draggable="false" />
          <!--
            등급별 여우. 카드 그림(.result-layout, z-index 1)보다 아래(z-index 0)에 두어
            아랫몸이 카드에 가려지고 고개만 카드 위로 나온다. 그림은 script.js 가 등급에
            따라 바꾸므로 의사 요소가 아니라 img 로 둔다.
          -->
          <img id="result-fox" class="result-fox" src="assets/result/good.png?v=2026-10-15e" alt="" width="238" height="270" draggable="false" />
          <img class="result-layout" src="assets/result/bg.png?v=2026-10-15e" alt="" draggable="false" />
          <canvas
            id="result-particle-canvas"
            class="result-particle-canvas"
            width="1920"
            height="1080"
            aria-hidden="true"
          ></canvas>
          <img
            id="result-headline"
            class="result-title"
            src="assets/result/result_text1.png"
            alt="Good"
            draggable="false"
          />

          <!-- 공통-2: Correct · Incorrect 는 개수(단위 없음), Bonus 는 '+' 없이 숫자 — 뒤의 '점' 은 styles.css 가 붙인다. -->
          <output id="result-correct" class="result-points result-points-correct" aria-label="맞힌 문항 0개">0</output>
          <output id="result-incorrect" class="result-points result-points-incorrect" aria-label="못 맞힌 문항 0개">0</output>
          <output id="result-bonus" class="result-points result-points-bonus" aria-label="보너스 점수 0점">0</output>

          <div class="result-total" aria-label="내 점수">
            <span id="result-rank" class="result-rank">-</span>
            <img class="result-point-box" src="assets/result/result_point_box.png?v=2026-10-15e" alt="" draggable="false" />
            <output id="result-total-score" class="result-total-score" aria-label="0점">
              <span id="result-total-value" class="result-score-number">0</span>
              <span class="result-score-unit">점</span>
            </output>
          </div>

          <p id="result-message" class="result-message" role="status" aria-live="polite"></p>

          <nav class="result-actions" aria-label="결과 화면 메뉴">
            <button id="incorrect-answers-button" class="result-action" type="button" aria-label="오답 없음" disabled>
              <img src="assets/result/btn1.png" alt="Incorrect Answers" draggable="false" />
            </button>
            <button id="ranking-button" class="result-action" type="button" disabled>
              <img src="assets/result/btn3.png" alt="Ranking" draggable="false" />
            </button>
            <button id="try-again-button" class="result-action" type="button" aria-label="다시 하기">
              <img src="assets/result/btn2.png" alt="Try Again" draggable="false" />
            </button>
          </nav>
        </section>

        <!-- 오답노트. 구조와 열 구성은 형제 방들과 같다. -->
        <div id="incorrect-answer-dialog" class="incorrect-answer-dialog" hidden>
          <button id="incorrect-answer-backdrop" class="incorrect-answer-backdrop" type="button" tabindex="-1" aria-label="오답 목록 닫기"></button>
          <section class="incorrect-answer-modal" role="dialog" aria-modal="true" aria-labelledby="incorrect-answer-title">
            <!-- 제목은 배경 그림에 이미 그려져 있어 화면에는 내지 않는다. -->
            <h2 id="incorrect-answer-title" class="visually-hidden">Incorrect Answers</h2>
            <img
              class="incorrect-answer-background"
              src="assets/incorrect-answer/bg_incorrect.png"
              alt=""
              width="1347"
              height="980"
              draggable="false"
            />
            <button id="incorrect-answer-close" class="incorrect-answer-close" type="button" aria-label="오답 목록 닫기">
              <img src="assets/incorrect-answer/btn_close_popup.png" alt="" width="77" height="87" draggable="false" />
            </button>

            <div class="incorrect-answer-table" role="table" aria-label="오답 목록">
              <div class="incorrect-answer-header incorrect-answer-grid" role="row">
                <span role="columnheader"><span class="visually-hidden">발음</span></span>
                <span role="columnheader">단어</span>
                <span role="columnheader">뜻</span>
              </div>
              <div id="incorrect-answer-list" class="incorrect-answer-list" role="rowgroup" tabindex="0" aria-label="오답 단어 목록"></div>
            </div>
          </section>
        </div>

        <!-- 랭킹. 배경 그림을 쓰지 않고 카드로 그린다(형제 방들과 동일). -->
        <div id="ranking-dialog" class="result-dialog" hidden>
          <button id="ranking-backdrop" class="result-dialog-backdrop" type="button" tabindex="-1" aria-label="랭킹 닫기"></button>
          <section class="result-dialog-card" role="dialog" aria-modal="true" aria-labelledby="ranking-title">
            <!--
              검수 r8: 헤더에 있던 게임명(WORD MATCH · MOLE)을 지우고 Ranking
              타이틀만 헤더 세로 가운데에 둔다.
            -->
            <header class="ranking-header">
              <h2 id="ranking-title">Ranking</h2>
              <button id="ranking-close" class="result-dialog-close" type="button" aria-label="랭킹 닫기">
                <img src="assets/incorrect-answer/btn_close_popup.png" alt="" width="77" height="87" draggable="false" />
              </button>
            </header>

            <section class="ranking-my-best" aria-label="내 최고 점수">
              <span class="ranking-my-badge" aria-hidden="true">
                <img id="ranking-my-badge-image" alt="" hidden />
                <span id="ranking-my-badge-fallback">O</span>
              </span>
              <span class="ranking-my-label">My Best</span>
              <strong id="ranking-my-nickname" class="ranking-my-name">회원</strong>
              <strong id="ranking-my-score" class="ranking-my-score">0</strong>
            </section>

            <div class="ranking-table" role="table" aria-label="랭킹">
              <div class="ranking-table-header ranking-grid" role="row">
                <span role="columnheader">순위</span>
                <span role="columnheader" aria-label="배지"></span>
                <span role="columnheader">닉네임</span>
                <span role="columnheader">최고 점수</span>
              </div>
              <div id="ranking-body" class="result-dialog-content" role="rowgroup" tabindex="0" aria-label="랭킹 목록"></div>
            </div>
            <p id="ranking-status" class="visually-hidden" role="status" aria-live="polite"></p>
          </section>
        </div>

        <!-- 도움말. 형제 방들과 같이 팝업이 아니라 전용 배경의 전체 화면이다. -->
        <section id="help-dialog" class="screen help-screen" role="dialog" aria-labelledby="help-title" hidden>
          <img class="help-background" src="assets/guide/help_bg.png?v=2026-10-15e" alt="" width="1920" height="1081" draggable="false" />
          <h2 id="help-title" class="visually-hidden">도움말</h2>
          <div class="help-scroll-area">
            <div id="help-content-viewport" class="help-content-viewport" tabindex="0">
              <div id="help-content" class="help-content"></div>
              <div id="help-status" class="help-status" role="status" aria-live="polite">
                <span id="help-status-text">도움말을 불러오는 중입니다.</span>
                <button id="help-retry-button" class="help-retry-button" type="button" hidden>Retry</button>
              </div>
            </div>
            <!-- 아래에 더 있을 때만 뜨는 안내. script.js 가 has-more 로 켜고 끈다. -->
            <span class="help-scroll-hint" aria-hidden="true"></span>
          </div>
        </section>

        <!-- 로딩 / 오류 -->
        <section id="loading-screen" class="loading-screen" aria-live="polite">
          <div class="loading-card">
            <span class="loading-spinner" aria-hidden="true"></span>
            <h2 id="loading-title" class="loading-title">게임 준비 중</h2>
            <p id="loading-message" class="loading-message">단어와 게임 정보를 불러오고 있습니다.</p>
            <button id="retry-button" class="retry-button" type="button" hidden>다시 시도</button>
          </div>
        </section>
      </section>
    </div>

    <script type="application/json" id="gameConfig">
      {
        "deployment": {
          "apiBaseUrl": "https://apis-review.littlefox.com",
          "apiUserAgent": "LITTLEFOX_VOCA_WEB:desktop/1.0.0/browser/Web:unknown"
        },
        "scoring": { "correct": 100, "incorrect": -10, "comboEvery": 3, "comboBonus": 100 },
        "demo": {
          "info": { "play_time": 120 },
          "words": [
            { "text": "goblin", "mean": "도깨비, 악귀" },
            { "text": "principal", "mean": "학교 교장" },
            { "text": "auditorium", "mean": "대강당, 공연장" },
            { "text": "assembly", "mean": "조회, 집회, 모임" },
            { "text": "planet", "mean": "행성" },
            { "text": "rocket", "mean": "로켓" },
            { "text": "galaxy", "mean": "은하" },
            { "text": "comet", "mean": "혜성" },
            { "text": "gravity", "mean": "중력" },
            { "text": "telescope", "mean": "망원경" },
            { "text": "satellite", "mean": "인공위성" },
            { "text": "technique", "mean": "1. (특수한) 기술, (2. 미술, 예술)" },
            { "text": "extraordinary", "mean": "대단히 비범하고 놀라운" },
            { "text": "eclipse", "mean": "일식" }
          ]
        }
      }
    </script>

    <script src="mole.js?v=2026-10-15e"></script>
    <script src="rules.js?v=2026-10-15e"></script>
    <script src="api-client.js?v=2026-10-15e"></script>
    <script src="content-loader.js?v=2026-10-15e"></script>
    <script src="script.js?v=2026-10-15e"></script>
  </body>
</html>
