<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b4d9b" />
    <meta name="description" content="영어 단어에 맞는 뜻의 조개를 고르는 Word Match 물속 조개 퀴즈" />
    <title>Word Match - 버블터치</title>
    <link rel="icon" href="assets/game/shell0_2.png" />
    <link rel="stylesheet" href="styles.css?v=20261015-5" />
  </head>
  <body>
    <main class="viewport">
      <h1 class="sr-only">Word Match Seashell</h1>
      <section id="game-stage" class="game-stage" aria-label="영어 단어에 맞는 뜻의 조개를 고르는 퀴즈">
        <img class="background" src="assets/start/bg.png" alt="" />

        <p id="status-toast" class="status-toast" role="status" aria-live="polite"></p>

        <button
          id="sound-button"
          class="global-control sound-button"
          type="button"
          aria-label="소리 끄기"
          aria-pressed="true"
          hidden
        >
          <img id="sound-icon" src="assets/btn_sound_on.png" alt="" width="66" height="69" draggable="false" />
        </button>

        <button
          id="navigation-button"
          class="global-control navigation-button"
          type="button"
          aria-label="게임 닫기"
          hidden
        >
          <img id="navigation-icon" src="assets/btn_close.png" alt="" width="66" height="69" draggable="false" />
        </button>

        <section id="start-screen" class="screen start-screen" aria-label="시작 화면" hidden>
          <div class="start-background-effects" aria-hidden="true">
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
          </div>
          <img
            class="start-logo"
            src="assets/start/logo.png"
            alt="Word Match"
            width="959"
            height="645"
            draggable="false"
          />
          <span class="start-character-aura" aria-hidden="true"></span>
          <img
            class="start-character"
            src="assets/start/fox_swim2.png"
            alt=""
            width="254"
            height="404"
            draggable="false"
          />

          <!-- 2차 검수 공통-9: 동화 정보(API info 의 title · subtitle). 로고와 Start 버튼 사이에 둔다. 값이 없으면 숨는다. -->
          <div id="start-story" class="start-story" role="group" aria-label="동화 정보" hidden>
            <p id="start-story-title" class="start-story-title"></p>
            <p id="start-story-subtitle" class="start-story-subtitle"></p>
          </div>

          <nav class="start-menu" aria-label="시작 메뉴">
            <button id="start-button" class="start-menu-button start-menu-button-play" type="button" aria-busy="true" disabled>
              <span>Start</span>
            </button>
            <button id="start-ranking-button" class="start-menu-button start-menu-button-ranking" type="button" disabled>
              <span>Ranking</span>
            </button>
          </nav>

          <button id="help-button" class="start-help-button" type="button" aria-label="도움말" disabled>
            <img src="assets/btn_help.png" alt="" width="62" height="63" draggable="false" />
          </button>
        </section>

        <section
          id="help-screen"
          class="screen help-screen"
          role="dialog"
          aria-labelledby="help-screen-title"
          hidden
        >
          <img class="help-background" src="assets/help/help_bg.png" alt="" width="1920" height="1080" draggable="false" />
          <h2 id="help-screen-title" class="sr-only">도움말</h2>
          <div class="help-content-viewport" tabindex="0">
            <div id="help-content" class="help-content"></div>
            <div id="help-status" class="help-status" role="status" aria-live="polite">
              <span id="help-status-message">도움말을 불러오는 중입니다.</span>
              <button id="help-retry-button" class="help-retry-button" type="button" hidden>Retry</button>
            </div>
          </div>
        </section>

        <section id="play-screen" class="screen play-screen" aria-label="물속 조개 단어 퀴즈" hidden>
        <img class="play-background" src="assets/game/bg_game.png" alt="" width="1920" height="1080" draggable="false" />
        <div class="play-bubbles" aria-hidden="true">
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
        </div>
        <div class="quiz-panel">
          <img class="quiz-box" src="assets/game/quiz_panel.png" alt="" />
          <!-- 2차 검수 WM공통-1: 단어 듣기(사운드) 버튼은 지웠다. 새 단어가 뜰 때의 자동 발음과 오답 목록의 스피커는 그대로다. -->
          <div class="question" aria-live="polite">
            <span id="word-english" class="word word-english">Ridiculous</span>
          </div>
        </div>

        <div class="shell-field" role="group" aria-label="알맞은 뜻의 조개를 선택하세요">
          <button id="shell-0" type="button" class="shell-button shell-slot-0" data-choice="0" disabled
            data-closed="assets/game/shell0_0.png" data-half="assets/game/shell0_1.png" data-open="assets/game/shell0_2.png">
            <img class="shell-image" src="assets/game/shell0_0.png" alt="" draggable="false" />
            <span class="shell-text"></span>
          </button>
          <button id="shell-1" type="button" class="shell-button shell-slot-1" data-choice="1" disabled
            data-closed="assets/game/shell1_0.png" data-half="assets/game/shell1_1.png" data-open="assets/game/shell1_2.png">
            <img class="shell-image" src="assets/game/shell1_0.png" alt="" draggable="false" />
            <span class="shell-text"></span>
          </button>
          <button id="shell-2" type="button" class="shell-button shell-slot-2" data-choice="2" disabled
            data-closed="assets/game/shell2_0.png" data-half="assets/game/shell2_1.png" data-open="assets/game/shell2_2.png">
            <img class="shell-image" src="assets/game/shell2_0.png" alt="" draggable="false" />
            <span class="shell-text"></span>
          </button>
          <button id="shell-3" type="button" class="shell-button shell-slot-3" data-choice="3" disabled
            data-closed="assets/game/shell3_0.png" data-half="assets/game/shell3_1.png" data-open="assets/game/shell3_2.png">
            <img class="shell-image" src="assets/game/shell3_0.png" alt="" draggable="false" />
            <span class="shell-text"></span>
          </button>
        </div>

        <img
          class="character is-idle"
          src="assets/game/fox_swim2.png"
          alt=""
          draggable="false"
        />
        <img class="hud" src="assets/game/ui_bar.png?v=20261012-1" alt="" draggable="false" />
        <!-- 2차 검수 공통-5: 새 아래 막대(ui_bar.png)에는 Score 상자가 없다. 상자는 따로 그리고 점수 숫자를 그 위에 올린다. -->
        <img class="score-box" src="assets/game/box_score.png?v=20261012-1" alt="" draggable="false" />
        <strong id="score-value" class="score-value" aria-label="점수 0">0</strong>
        <span id="score-burst" class="score-burst" aria-hidden="true"></span>
        <output id="score-delta" class="score-delta" aria-live="polite"></output>

        <img class="timer-track" src="assets/game/ui_timer3.png" alt="" draggable="false" />
        <img id="timer-fill" class="timer-fill" src="assets/game/ui_timer2.png" alt="" draggable="false" />
        <img class="timer-clock" src="assets/game/ui_timer1.png" alt="" draggable="false" />
        <strong id="time-value" class="time-value" aria-label="게임 준비 중">--:--</strong>
        <!-- 2차 수정 16번: 남은 10초부터 타임바를 고르게 빨갛게 바꾸는 색 필터. 밝기는 살리고 색만 빨강으로 모은다. -->
        <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
          <filter id="timer-fill-red" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.24 0.48 0.09 0 0.30  0.03 0.06 0.01 0 0.03  0.04 0.08 0.015 0 0.05  0 0 0 1 0" />
          </filter>
        </svg>

        <!-- 2차 수정 10번: 보너스 점수는 점수판 위가 아니라 보너스 공(셋째 칸) 위에 BONUS 띠와 함께 띄운다. -->
        <strong id="bonus-gain" class="bonus-gain" aria-hidden="true" hidden>
          <span class="bonus-gain-label">BONUS</span>
          <span class="bonus-gain-value">+100</span>
        </strong>

        <div id="bonus-meter" class="bonus-meter" aria-label="연속 정답 0단계">
          <span class="bonus-slot bonus-one" data-combo-step="1" aria-hidden="true">
            <img class="bonus-image" src="assets/game/btn_bonus0.png" alt="" draggable="false" />
            <span class="bonus-glass"></span>
            <span class="bonus-sparks"></span>
            <strong class="bonus-step-gain" hidden>+100</strong>
          </span>
          <span class="bonus-slot bonus-two" data-combo-step="2" aria-hidden="true">
            <img class="bonus-image" src="assets/game/btn_bonus1.png" alt="" draggable="false" />
            <span class="bonus-glass"></span>
            <span class="bonus-sparks"></span>
            <strong class="bonus-step-gain" hidden>+100</strong>
          </span>
          <span class="bonus-slot bonus-three" data-combo-step="3" aria-hidden="true">
            <img class="bonus-image" src="assets/game/btn_bonus2.png" alt="" draggable="false" />
            <span class="bonus-glass"></span>
            <span class="bonus-sparks"></span>
          </span>
        </div>

        <p id="game-status" class="sr-only" aria-live="assertive"></p>
        </section>

        <section id="end-screen" class="end-screen" aria-label="게임 결과" aria-hidden="true">
          <button
            id="result-home-button"
            class="result-home-button"
            type="button"
            aria-label="시작 화면으로"
          >
            <img src="assets/btn_close.png" alt="" draggable="false" />
          </button>

          <img class="result-background" src="assets/result/bg_scene.png" alt="" draggable="false" />
          <img class="result-layout" src="assets/result/bg.png?v=20261012-1" alt="" draggable="false" />
          <!-- 등급별 여우. 카드는 bg.png 그림 안에 그려져 있어 가릴 요소가 없으므로
               카드 상단선에서 잘라 몸 아래쪽이 카드에 가려진 것처럼 보이게 한다. -->
          <!-- 주소는 등급 표 한 곳에만 둔다. 여기에도 적으면 표와 어긋나
               미리받기와 교체가 다른 주소를 써서 같은 그림을 두 번 받는다(검수 4차 함정 11-1).
               결과 화면이 켜지기 전에 표에서 주소가 들어가므로 빈 src 가 보이지 않는다. -->
          <div class="result-fox" aria-hidden="true">
            <img id="result-fox-image" alt="" draggable="false" />
          </div>
          <canvas
            id="result-particle-canvas"
            class="result-particle-canvas"
            width="1920"
            height="1080"
            aria-hidden="true"
          ></canvas>
          <img
            id="result-title"
            class="result-title"
            src="assets/result/result_text1.png"
            alt="Good"
            draggable="false"
          />

          <output id="result-correct-points" class="result-points result-points-correct" aria-label="맞힌 문항 0개">0</output>
          <output id="result-incorrect-points" class="result-points result-points-incorrect" aria-label="오답 문항 0개">0</output>
          <output id="result-bonus-points" class="result-points result-points-bonus" aria-label="보너스 점수 0점">0</output>

          <div class="result-total" aria-label="내 점수">
            <span id="result-rank" class="result-rank">-</span>
            <img class="result-point-box" src="assets/result/result_point_box.png?v=20260929-4" alt="" draggable="false" />
            <output id="result-total-score" class="result-total-score" aria-label="0점">
              <span id="result-score-number" class="result-score-number">0</span>
              <span class="result-score-unit">점</span>
            </output>
          </div>

          <p id="result-message" class="result-message" role="status" aria-live="polite"></p>

          <nav class="result-actions" aria-label="결과 화면 메뉴">
            <button id="incorrect-answers-button" class="result-action" type="button" aria-label="오답 없음" disabled>
              <img src="assets/result/btn1.png" alt="Incorrect Answers" draggable="false" />
            </button>
            <button id="ranking-button" class="result-action" type="button" disabled>
              <img src="assets/result/btn3.png" alt="Ranking" draggable="false" />
            </button>
            <button id="try-again-button" class="result-action" type="button" aria-label="다시 하기">
              <img src="assets/result/btn2.png" alt="Try Again" draggable="false" />
            </button>
          </nav>

          <div id="incorrect-answer-dialog" class="incorrect-answer-dialog" hidden>
            <button
              id="incorrect-answer-backdrop"
              class="incorrect-answer-backdrop"
              type="button"
              tabindex="-1"
              aria-label="오답 목록 닫기"
            ></button>

            <section
              class="incorrect-answer-modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="incorrect-answer-dialog-title"
            >
              <h2 id="incorrect-answer-dialog-title" class="sr-only">Incorrect Answers</h2>
              <img
                class="incorrect-answer-background"
                src="assets/incorrect-answer/bg_incorrect.png"
                alt=""
                width="1347"
                height="980"
                draggable="false"
              />
              <button
                id="incorrect-answer-close-button"
                class="incorrect-answer-close"
                type="button"
                aria-label="오답 목록 닫기"
              >
                <img
                  src="assets/incorrect-answer/btn_close_popup.png"
                  alt=""
                  width="77"
                  height="87"
                  draggable="false"
                />
              </button>

              <div class="incorrect-answer-table" role="table" aria-label="오답 목록">
                <div class="incorrect-answer-header incorrect-answer-grid" role="row">
                  <span role="columnheader"><span class="sr-only">발음</span></span>
                  <span role="columnheader">단어</span>
                  <span role="columnheader">뜻</span>
                </div>
                <div
                  id="incorrect-answer-list"
                  class="incorrect-answer-list"
                  role="rowgroup"
                  tabindex="0"
                  aria-label="오답 단어 목록"
                ></div>
              </div>
            </section>
          </div>

        </section>

        <div id="result-dialog" class="result-dialog" hidden>
          <button id="result-dialog-backdrop" class="result-dialog-backdrop" type="button" tabindex="-1" aria-label="랭킹 닫기"></button>
          <section class="result-dialog-card" role="dialog" aria-modal="true" aria-labelledby="result-dialog-title">
            <header class="ranking-header">
              <h2 id="result-dialog-title">Ranking</h2>
              <button id="result-dialog-close" class="result-dialog-close" type="button" aria-label="랭킹 닫기">
                <img src="assets/incorrect-answer/btn_close_popup.png" alt="" width="77" height="87" draggable="false" />
              </button>
            </header>

            <section class="ranking-my-best" aria-label="내 최고 점수">
              <span class="ranking-my-badge" aria-hidden="true">
                <img id="ranking-my-badge-image" alt="" hidden />
                <span id="ranking-my-badge-fallback">O</span>
              </span>
              <span class="ranking-my-label">My Best</span>
              <strong id="ranking-my-name" class="ranking-my-name">회원</strong>
              <strong id="ranking-my-score" class="ranking-my-score">0</strong>
            </section>

            <div class="ranking-table" role="table" aria-label="랭킹">
              <div class="ranking-table-header ranking-grid" role="row">
                <span role="columnheader">순위</span>
                <span role="columnheader" aria-label="배지"></span>
                <span role="columnheader">닉네임</span>
                <span role="columnheader">최고 점수</span>
              </div>
              <div
                id="result-dialog-content"
                class="result-dialog-content"
                role="rowgroup"
                tabindex="0"
                aria-label="랭킹 목록"
              ></div>
            </div>
          </section>
        </div>

        <section id="loading-screen" class="loading-screen" aria-live="polite">
          <div class="loading-card">
            <span class="loading-spinner" aria-hidden="true"></span>
            <h2 id="loading-title">게임 준비 중</h2>
            <p id="loading-message">단어와 게임 정보를 불러오고 있습니다.</p>
            <button id="retry-button" class="retry-button" type="button" hidden>다시 시도</button>
          </div>
        </section>
      </section>

      <noscript>이 게임을 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
    </main>

    <script id="gameConfig" type="application/json">
      {
        "schemaVersion": 2,
        "deployment": {
          "apiUserAgent": "LITTLEFOX_VOCA_WEB:desktop/1.0.0/browser/Web:unknown"
        },
        "timing": {
          "questionDurationMs": 6000
        },
        "scoring": {
          "correct": 100,
          "incorrect": -10,
          "comboEvery": 3,
          "comboBonus": 100
        },
        "questions": [
          { "english": "Found",  "choices": ["발견했다\n찾았다", "숲", "밝은", "빠른"], "answerIndex": 0 },
          { "english": "Forest", "choices": ["미소 짓다", "숲", "강", "무거운"], "answerIndex": 1 },
          { "english": "Bright", "choices": ["창문", "이른", "밝은", "정원"], "answerIndex": 2 },
          { "english": "Quick",  "choices": ["숲", "강", "무거운", "빠른"], "answerIndex": 3 },
          { "english": "Smile",  "choices": ["미소 짓다", "창문", "이른", "정원"], "answerIndex": 0 },
          { "english": "River",  "choices": ["밝은", "강", "빠른", "숲"], "answerIndex": 1 },
          { "english": "Heavy",  "choices": ["정원", "미소 짓다", "무거운", "창문"], "answerIndex": 2 },
          { "english": "Window", "choices": ["이른", "숲", "강", "창문"], "answerIndex": 3 },
          { "english": "Early",  "choices": ["이른", "밝은", "정원", "빠른"], "answerIndex": 0 },
          { "english": "Garden", "choices": ["무거운", "정원", "미소 짓다", "강"], "answerIndex": 1 }
        ]
      }
    </script>
    <script src="api-client.js?v=20260813-1"></script>
    <script src="content-loader.js?v=20261012-1"></script>
    <script src="script.js?v=20261015-5"></script>
  </body>
</html>
