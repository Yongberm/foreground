<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#2e6fd6" />
  <meta name="description" content="한글 뜻을 보고 파이프 위의 철자 방울을 순서대로 눌러 영어 단어를 완성하는 Spelling Builder 워드파이프 게임" />
  <title>Spelling Builder - 워드파이프</title>
  <link rel="icon" href="assets/game/slot_on.png?v=20261015-3" />
  <!-- 첫 사용 시점에 지연 로드되는 자산(수집된 방울·트레이 칩)은 미리 받아 깜빡임을 없앤다. -->
  <link rel="preload" as="image" href="assets/game/slot_off.png?v=20261015-3" />
  <link rel="stylesheet" href="styles.css?v=20261015-3" />
</head>

<body>
  <main class="viewport">
    <h1 class="sr-only">Spelling Builder 워드파이프</h1>
    <section id="game-stage" class="game-stage" aria-label="철자 방울을 순서대로 눌러 단어를 완성하는 게임">
      <img class="background" src="assets/game/game_bg.png?v=20261015-3" alt="" draggable="false" />

      <p id="status-toast" class="status-toast" role="status" aria-live="polite"></p>

      <button id="sound-button" class="global-control sound-button" type="button" aria-label="소리 끄기" aria-pressed="true"
        hidden>
        <img id="sound-icon" src="assets/btn_sound_on.png?v=20261015-3" alt="" width="66" height="69"
          draggable="false" />
      </button>

      <button id="navigation-button" class="global-control navigation-button" type="button" aria-label="게임 닫기" hidden>
        <img id="navigation-icon" src="assets/btn_close.png?v=20261015-3" alt="" width="66" height="69"
          draggable="false" />
      </button>

      <!-- 오프닝(공통) -->
      <section id="start-screen" class="screen start-screen" aria-label="시작 화면" hidden>
        <img class="start-background" src="assets/start/start_bg.png?v=20261015-3" alt="" width="1920" height="1080"
          draggable="false" />
        <!-- 2차 검수 공통-9: 로고 · 여우 · 방울을 한 덩어리로 줄여 올려 로고와 Start 사이에 동화 정보 자리를 만든다. -->
        <div class="start-brand">
          <img class="start-char" src="assets/start/char.png?v=20261015-3" alt="" draggable="false" />
          <img class="start-logo" src="assets/start/logo.png?v=20261015-3" alt="Spelling Builder" width="1315"
            height="438" draggable="false" />
          <img class="start-drop start-drop-a" src="assets/start/drop_a.png?v=20261015-3" alt="" draggable="false" />
          <img class="start-drop start-drop-b" src="assets/start/drop_b.png?v=20261015-3" alt="" draggable="false" />
          <img class="start-drop start-drop-c" src="assets/start/drop_c.png?v=20261015-3" alt="" draggable="false" />
        </div>

        <!-- 2차 검수 공통-9: 동화 정보(API info 의 title · subtitle). 값이 없으면 숨긴다. -->
        <div id="start-story" class="start-story" role="group" aria-label="동화 정보" hidden>
          <p id="start-story-title" class="start-story-title"></p>
          <p id="start-story-subtitle" class="start-story-subtitle"></p>
        </div>

        <!-- 검수 r14: 스펠링빌더는 랭킹이 없다. Start 버튼 하나만 둔다. -->
        <nav class="start-menu" aria-label="시작 메뉴">
          <button id="start-button" class="start-menu-button start-menu-button-play" type="button" aria-busy="true"
            disabled>
            <span>Start</span>
          </button>
        </nav>

        <button id="help-button" class="start-help-button" type="button" aria-label="도움말" disabled>
          <img src="assets/btn_help.png?v=20261015-3" alt="" width="62" height="63" draggable="false" />
        </button>
      </section>

      <!-- 도움말(공통) -->
      <section id="help-screen" class="screen help-screen" role="dialog" aria-labelledby="help-screen-title" hidden>
        <img class="help-background" src="assets/guide/bg.png?v=20261015-3" alt="" width="1920" height="1080"
          draggable="false" />
        <h2 id="help-screen-title" class="sr-only">도움말</h2>
        <div class="help-content-viewport" tabindex="0">
          <div id="help-content" class="help-content"></div>
          <div id="help-status" class="help-status" role="status" aria-live="polite">
            <span id="help-status-message">도움말을 불러오는 중입니다.</span>
            <button id="help-retry-button" class="help-retry-button" type="button" hidden>Retry</button>
          </div>
        </div>
      </section>

      <!-- 게임(워드파이프) -->
      <section id="play-screen" class="screen play-screen" aria-label="워드파이프" hidden>
        <!-- z순서: 여우(파이프 뒤) < 파이프(보석 포함) < 방울 < 패널들 -->
        <img class="play-char" src="assets/game/char.png?v=20261015-3" alt="" width="335" height="389"
          draggable="false" />
        <img class="play-pipe" src="assets/game/pipe.png?v=20261015-3" alt="" width="1920" height="1080"
          draggable="false" />

        <div id="pipe-slots" class="pipe-slots" role="group" aria-label="철자 방울"></div>

        <div class="meaning-panel">
          <img class="meaning-box" src="assets/game/pannel.png?v=20261015-3" alt="" width="742" height="187"
            draggable="false" />
          <p id="word-meaning" class="meaning-text" aria-live="polite">
            <span id="word-meaning-text" class="meaning-text-inner"></span>
          </p>
        </div>

        <!-- 2-2 정답 채워지는 공간 (검수 r51): 철자 수만큼 밑줄을 깔고 그 위에 채운다 -->
        <div class="answer-tray">
          <img class="tray-box" src="assets/game/result_pannel.png?v=20261015-3" alt="" width="1108" height="183"
            draggable="false" />
          <div id="answer-slots" class="answer-slots" aria-live="polite" aria-label="모은 철자"></div>
        </div>

        <div class="score-panel">
          <img class="score-box" src="assets/game/ui_score.png?v=20261015-3" alt="" width="254" height="267"
            draggable="false" />
          <span class="score-label" aria-hidden="true">Score</span>
          <output id="score-value" class="score-value" aria-label="점수">0</output>
        </div>

        <div class="timer-panel">
          <img class="timer-box" src="assets/game/ui_timer.png?v=20261015-3" alt="" width="254" height="267"
            draggable="false" />
          <output id="question-progress" class="question-progress" aria-label="문항 진행">1/12</output>
          <output id="timer-value" class="timer-value" aria-label="남은 시간">03:30</output>
        </div>

        <!-- 정답 출력: 화면을 덮고 단어만 크게 보여 준다. 완성·기회 소진 공용. -->
        <div id="answer-reveal" class="answer-reveal" role="status" aria-live="assertive" hidden>
          <p id="word-reveal" class="answer-reveal-word"></p>
        </div>

        <p id="game-status" class="sr-only" aria-live="assertive"></p>
      </section>

      <!-- 엔딩(공통 구조) -->
      <section id="end-screen" class="end-screen" aria-label="게임 결과" aria-hidden="true">
        <!-- 공통 9-2: 새로고침이 아니라 X 다. 누르면 점수를 저장한 뒤 시작 화면으로 나간다.
             (형제 12방과 id 를 맞추기 위해 id 는 그대로 둔다) -->
        <button id="result-replay-button" class="result-replay-button" type="button" aria-label="시작 화면으로">
          <img src="assets/btn_close.png?v=20261015-3" alt="" width="66" height="69" draggable="false" />
        </button>

        <img class="result-background" src="assets/game/game_bg.png?v=20261015-3" alt="" width="1920" height="1080"
          draggable="false" />
        <!-- 등급별 여우: 결과 카드 뒤(낮은 층)에 두어 아래쪽이 카드에 가려지게 한다.
             그림은 script 가 등급에 따라 갈아 끼운다(REWARD_VIEW). -->
        <img id="result-character" class="result-character" src="assets/result/good.png?v=20261015-3" alt=""
          width="238" height="270" draggable="false" />
        <img class="result-layout" src="assets/result/bg.png?v=20261015-3" alt="" width="1920" height="1080"
          draggable="false" />
        <canvas id="result-particle-canvas" class="result-particle-canvas" width="1920" height="1080"
          aria-hidden="true"></canvas>
        <img id="result-title" class="result-title" src="assets/result/result_text1.png?v=20261015-3" alt="Good"
          draggable="false" />

        <output id="result-correct-points" class="result-points result-points-correct" aria-label="정답 0개">0개</output>
        <output id="result-incorrect-points" class="result-points result-points-incorrect"
          aria-label="오답 0개">0개</output>
        <output id="result-bonus-points" class="result-points result-points-bonus" aria-label="보너스 0점">0점</output>

        <div class="result-total" aria-label="내 점수">
          <output id="result-total-score" class="result-total-score" aria-label="내 점수 0점">
            <span id="result-score-number" class="result-score-number">0</span>
            <span class="result-score-unit">점</span>
          </output>
        </div>

        <p id="result-message" class="result-message" role="status" aria-live="polite"></p>

        <nav class="result-actions" aria-label="결과 화면 메뉴">
          <button id="incorrect-answers-button" class="result-action" type="button" aria-label="오답 없음" disabled>
            <img src="assets/result/btn1.png?v=20261015-3" alt="Incorrect Answers" draggable="false" />
          </button>
          <button id="try-again-button" class="result-action" type="button" aria-label="다시 하기">
            <img src="assets/result/btn2.png?v=20261015-3" alt="Try Again" draggable="false" />
          </button>
        </nav>

        <div id="incorrect-answer-dialog" class="incorrect-answer-dialog" hidden>
          <button id="incorrect-answer-backdrop" class="incorrect-answer-backdrop" type="button" tabindex="-1"
            aria-label="오답 목록 닫기"></button>

          <section class="incorrect-answer-modal" role="dialog" aria-modal="true"
            aria-labelledby="incorrect-answer-dialog-title">
            <h2 id="incorrect-answer-dialog-title" class="sr-only">Incorrect Answers</h2>
            <img class="incorrect-answer-background" src="assets/incorrect-answer/bg_incorrect.png?v=20261015-3" alt=""
              width="1347" height="980" draggable="false" />
            <button id="incorrect-answer-close-button" class="incorrect-answer-close" type="button"
              aria-label="오답 목록 닫기">
              <img src="assets/incorrect-answer/btn_close_popup.png?v=20261015-3" alt="" width="77" height="87"
                draggable="false" />
            </button>

            <div class="incorrect-answer-table" role="table" aria-label="오답 단어 목록">
              <div class="incorrect-answer-header incorrect-answer-grid" role="row">
                <span role="columnheader"><span class="sr-only">발음</span></span>
                <span role="columnheader">단어</span>
                <span role="columnheader">뜻</span>
              </div>
              <div id="incorrect-answer-list" class="incorrect-answer-list" role="rowgroup" tabindex="0"
                aria-label="오답 단어 목록"></div>
            </div>
          </section>
        </div>
      </section>

      <!-- 로딩 -->
      <section id="loading-screen" class="loading-screen" aria-live="polite">
        <div class="loading-card">
          <span class="loading-spinner" aria-hidden="true"></span>
          <h2 id="loading-title">게임 준비 중</h2>
          <p id="loading-message">단어와 게임 정보를 불러오고 있습니다.</p>
          <button id="retry-button" class="retry-button" type="button" hidden>다시 시도</button>
        </div>
      </section>
    </section>

    <noscript>이 게임을 실행하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
  </main>

  <script id="gameConfig" type="application/json">
      {
        "schemaVersion": 2,
        "deployment": {
          "apiUserAgent": "LITTLEFOX_VOCA_WEB:desktop/1.0.0/browser/Web:unknown"
        },
        "waterpipe": {
          "questionCount": 12,
          "timerSeconds": 210
        },
        "words": [
          { "text": "apple",      "mean": "사과" },
          { "text": "water",      "mean": "물" },
          { "text": "pipe",       "mean": "파이프" },
          { "text": "bubble",     "mean": "거품" },
          { "text": "yellow",     "mean": "노란색" },
          { "text": "monkey",     "mean": "원숭이" },
          { "text": "rocket",     "mean": "로켓" },
          { "text": "planet",     "mean": "행성" },
          { "text": "dinosaur",   "mean": "공룡" },
          { "text": "elephant",   "mean": "코끼리" },
          { "text": "umbrella",   "mean": "우산" },
          { "text": "scientist",  "mean": "과학자" },
          { "text": "chemistry",  "mean": "화학" },
          { "text": "laboratory", "mean": "실험실" }
        ]
      }
    </script>
  <script src="api-client.js?v=20261015-3"></script>
  <script src="content-loader.js?v=20261015-3"></script>
  <script src="script.js?v=20261015-3"></script>
</body>

</html>
